name: Build and Test (Staging)

on:
  push:
    branches: ['develop']

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      PORTFOLIO_SOURCE_ROOT: .private/portfolio-fixture

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Create empty fixture source
        run: |
          mkdir -p "$PORTFOLIO_SOURCE_ROOT/records" "$PORTFOLIO_SOURCE_ROOT/public"
          for collection in pages work projects contributions credentials writing sketches knowledge social; do
            mkdir -p "$PORTFOLIO_SOURCE_ROOT/records/$collection"
          done
          printf '[]\n' > "$PORTFOLIO_SOURCE_ROOT/published.json"

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22'
          cache: 'npm'

      - name: Align npm version
        run: npm install --global npm@11.11.0

      - name: Verify Node.js and npm versions
        run: |
          node --version
          npm --version

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Validate public-content boundary
        run: npm run content:check

      - name: Test public-content contracts
        run: npm test

      - name: Type check
        run: npm run type-check

      - name: Build fixture foundation
        run: npm run build:fixtures

      - name: Test build output
        run: |
          if [ ! -d "dist" ]; then
            echo "Build failed - dist directory not found"
            exit 1
          fi
          if [ ! -f "dist/index.html" ]; then
            echo "Build failed - index.html not found in dist"
            exit 1
          fi
